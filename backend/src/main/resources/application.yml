spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:profa}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:profa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:profa}}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 10000
      max-lifetime: 1500000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  # Lighter JSON responses on slow mobile networks.
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/plain,text/html,text/css,application/javascript
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
  payments:
    # Shared secret expected in the X-Webhook-Secret header of payment provider callbacks.
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
  frontend-url: ${APP_FRONTEND_URL:https://profa-frontend-v2.onrender.com}
  mail:
    # SMTP (Brevo, Mailjet, Gmail…). Leave MAIL_HOST empty to disable e-mails.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:no-reply@profa.ml}
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
